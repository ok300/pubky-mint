<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pubky Mint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --bg-hover: #181818;
      --bg-unread: #1c1c1c;
      --bg-unread-hover: #232323;
      --bg-active: #1e2822;
      --border: #222;
      --border-dim: #161616;
      --accent: #5ecfa0;
      --accent-hover: #7de0b6;
      --text: #e0e0e0;
      --text-bright: #ddd;
      --text-secondary: #aaa;
      --text-dim: #888;
      --text-sub: #666;
      --text-muted: #555;
      --text-faint: #444;
      --avatar-bg: #2a2a2a;
    }

    body { font-family: monospace; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1.25rem; }
    #auth-screen h1 { font-size: 1.4rem; letter-spacing: 0.1em; }
    #auth-subtitle { color: var(--text-sub); font-size: 0.85rem; margin-top: -0.5rem; }
    #qr-wrap { padding: 12px; background: #fff; border-radius: 6px; }
    #auth-status { color: var(--text-sub); font-size: 0.85rem; }

    #app { display: none; flex-direction: column; height: 100vh; }
    #app-header { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 0.8rem; color: var(--text-dim); }
    #header-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--avatar-bg); object-fit: cover; flex-shrink: 0; }
    #header-name { color: var(--text-bright); }
    #logout-btn { background: none; border: none; color: var(--text-muted); font-family: monospace; font-size: 0.8rem; cursor: pointer; padding: 0; }
    #logout-btn:hover { color: #bbb; }
    #app-body { display: flex; flex: 1; overflow: hidden; }

    #col-left { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    #col-left-header, #col-mid-header, .follows-separator {
      padding: 0.75rem 1rem; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border);
    }
    #col-left-header, #col-mid-header { flex-shrink: 0; }
    #col-mid-header { display: flex; align-items: center; justify-content: space-between; }
    #header-btns { display: flex; gap: 0.4rem; }
    #save-checkpoints-btn, #load-checkpoints-btn { background: none; border: 1px solid #333; color: var(--text-faint); font-family: monospace; font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; cursor: default; letter-spacing: 0.05em; text-transform: uppercase; transition: border-color 0.1s, color 0.1s; }
    #save-checkpoints-btn:not(:disabled) { border-color: var(--accent); color: var(--accent); cursor: pointer; }
    #save-checkpoints-btn:not(:disabled):hover { border-color: var(--accent-hover); color: var(--accent-hover); }
    #load-checkpoints-btn { border-color: var(--text-faint); color: var(--text-sub); cursor: pointer; }
    #load-checkpoints-btn:hover { border-color: var(--text-sub); color: var(--text-secondary); }
    #col-mid-filter { display: flex; align-items: center; gap: 0.5rem 0.75rem; flex-wrap: wrap; padding: 0.45rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0; }
    #col-mid-filter label { display: flex; align-items: center; gap: 0.25rem; cursor: pointer; color: var(--text-sub); user-select: none; }
    #col-mid-filter label:hover { color: var(--text-secondary); }
    #col-mid-filter input[type="radio"] { accent-color: var(--accent); cursor: pointer; margin: 0; }
    .follows-separator { border-top: 1px solid var(--border); }

    #follows-list { list-style: none; overflow-y: auto; flex: 1; }

    .follow-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem calc(1rem - 2px); border-left: 2px solid transparent; cursor: pointer; border-bottom: 1px solid var(--border-dim); transition: background 0.08s; min-width: 0; }
    .follow-item:hover:not(.active),  .event-item:hover:not(.active)  { background: var(--bg-hover); }
    .follow-item.active, .event-item.active { background: var(--bg-active); border-left-color: var(--accent); }
    .follow-item.active .follow-name { color: #fff; }
    .follow-item--guest:not(.active) { border-left-color: #2a1f00; background: #111108; }
    .follow-item--guest:hover:not(.active) { background: #18180e; }
    .follow-unread:not(.active) { background: var(--bg-unread); }
    .follow-unread:not(.active) .follow-name { color: var(--text-bright); }
    .follow-unread .follow-name { font-weight: bold; }
    .follow-unread:hover:not(.active) { background: var(--bg-unread-hover); }

    .follow-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--avatar-bg); object-fit: cover; flex-shrink: 0; }
    .follow-text { overflow: hidden; }
    .follow-name { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-sub); }
    .follow-id   { font-size: 0.65rem; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .col-msg, .list-msg { padding: 1rem; color: var(--text-faint); font-size: 0.8rem; }

    #col-mid-wrap { flex: 1; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #col-mid { flex: 1; overflow-y: auto; }
    .events-list { list-style: none; padding: 0.5rem 0; }
    .event-item  { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem calc(1rem - 2px); border-left: 2px solid transparent; border-bottom: 1px solid var(--border-dim); font-size: 0.8rem; cursor: pointer; transition: background 0.08s; }
    .event-unread:not(.active)             { background: var(--bg-unread); }
    .event-unread:not(.active) .event-path { color: var(--text-bright); }
    .event-unread:hover:not(.active)       { background: var(--bg-unread-hover); }
    .event-item.active .event-path         { color: #fff; }

    .event-icon     { flex-shrink: 0; width: 16px; height: 16px; color: var(--text-dim); }
    .event-icon svg { display: block; width: 100%; height: 100%; }
    .event-cursor   { margin-left: auto; flex-shrink: 0; font-size: 0.6rem; color: var(--text-sub); }
    .checkpoint-btn { display: none; margin-left: auto; flex-shrink: 0; background: none; border: 1px solid var(--text-faint); color: var(--text-dim); font-family: monospace; font-size: 0.6rem; padding: 1px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .checkpoint-btn:hover { border-color: var(--text-sub); color: #bbb; }
    .event-item.active .event-cursor   { display: none; }
    .event-item.active .checkpoint-btn { display: inline-block; }
    .event-item.active.is-checkpoint .checkpoint-btn { display: none; }

    .event-badge { flex-shrink: 0; font-size: 0.65rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; }
    .event-put  { background: #1a3a1a; color: var(--accent); }
    .event-del  { background: #3a1a1a; color: #f44336; }
    .tag-badge  { background: #2a2200; color: #e6c200; text-transform: lowercase; font-size: 0.9rem; }
    .event-path { color: var(--text-sub); word-break: break-all; }
    .load-more-wrap { padding: 0.75rem 1rem; text-align: center; }
    .events-range   { font-size: 0.7rem; color: var(--text-faint); margin-bottom: 0.5rem; }
    .load-more-actions { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    .load-more-btn  { background: none; border: 1px solid #333; color: var(--text-sub); font-family: monospace; font-size: 0.75rem; padding: 0.4rem 0.9rem; border-radius: 3px; cursor: pointer; transition: border-color 0.1s, color 0.1s; }
    .load-more-btn:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-secondary); }
    .load-more-btn:disabled { opacity: 0.4; cursor: default; }

    #col-right      { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #content-path   { padding: 0.6rem 1rem; font-size: 0.7rem; color: var(--text-muted); border-bottom: 1px solid var(--border); word-break: break-all; flex-shrink: 0; }
    #open-in-pubky  { margin-left: 0.5rem; color: var(--accent); text-decoration: none; white-space: nowrap; }
    #open-in-pubky:hover { text-decoration: underline; }
    #parsed-section { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; line-height: 1.6; flex-shrink: 0; }
    #parsed-section:empty { display: none; }
    .parsed-label, .raw-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .parsed-label { color: var(--text-muted); display: block; margin-bottom: 0.2rem; }
    .raw-label    { color: var(--text-faint); padding: 0.4rem 1rem; border-bottom: 1px solid #1a1a1a; }
    .parsed-field { margin-bottom: 0.75rem; }
    .parsed-field:last-child { margin-bottom: 0; }
    .parsed-post-content { color: var(--text-bright); white-space: pre-wrap; word-break: break-word; }
    .parsed-post-quote   { color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; border-left: 2px solid var(--text-faint); padding-left: 0.65rem; margin-left: 0.1rem; }
    .parsed-author       { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .parsed-author:hover { opacity: 0.8; }
    .parsed-author-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--avatar-bg); object-fit: cover; flex-shrink: 0; }
    #raw-section  { flex: 1; overflow-y: auto; }
    #content-body { padding: 1rem; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; color: #ccc; line-height: 1.5; }
  </style>
</head>
<body>

<div id="auth-screen">
  <h1>Pubky Mint</h1>
  <p id="auth-subtitle">A refreshing way to browse</p>
  <div id="qr-wrap"><canvas id="qr-canvas"></canvas></div>
  <p id="auth-status">Scan with your Pubky app to sign in</p>
</div>

<div id="app">
  <div id="app-header">
    <img id="header-avatar" alt="">
    <span>Logged in as</span>
    <span id="header-name"></span>
    <span>/</span>
    <button id="logout-btn">Logout</button>
  </div>
  <div id="app-body">
    <div id="col-left">
      <div id="col-left-header">Following</div>
      <ul id="follows-list"><li class="list-msg">Loading…</li></ul>
    </div>
    <div id="col-mid-wrap">
      <div id="col-mid-header"><span id="col-mid-header-text">Checkpoint: —</span><div id="header-btns"><button id="save-checkpoints-btn" disabled>Save</button><button id="load-checkpoints-btn">Load</button></div></div>
      <input type="file" id="load-checkpoints-input" accept=".json" style="display:none">
      <div id="col-mid-filter">
        <span>Show:</span>
        <label><input type="radio" name="event-filter" value="all"> All events</label>
        <label><input type="radio" name="event-filter" value="post" checked> Posts</label>
        <label><input type="radio" name="event-filter" value="tag"> Tags</label>
        <label><input type="radio" name="event-filter" value="follow"> Follows</label>
        <label><input type="radio" name="event-filter" value="bookmark"> Bookmarks</label>
      </div>
      <div id="col-mid"></div>
    </div>
    <div id="col-right"></div>
  </div>
</div>

<script type="module">
  import init, { Pubky, AuthFlowKind } from "./pkg/pubky_wasm.js";
  import QRCode from "https://esm.sh/qrcode@1.5.4";

  const authScreen      = document.getElementById("auth-screen");
  const authStatus      = document.getElementById("auth-status");
  const appEl           = document.getElementById("app");
  const followsList     = document.getElementById("follows-list");
  const colMid          = document.getElementById("col-mid");
  const colMidHeaderTxt = document.getElementById("col-mid-header-text");
  const colRight        = document.getElementById("col-right");
  const saveBtn         = document.getElementById("save-checkpoints-btn");
  const loadBtn         = document.getElementById("load-checkpoints-btn");
  const loadInput       = document.getElementById("load-checkpoints-input");

  const checkpoints   = {};
  const latestCursors = {};
  let currentLoadedCursors = new Set();
  let currentMidZ32   = null;

  const mk      = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mkImg   = (cls, src) => Object.assign(mk("img", cls), { alt: "", src });
  const svgIcon = d => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const midMsg  = m => { colMid.innerHTML = `<p class="col-msg">${m}</p>`; };

  const uriZ32 = uri => uri.replace(/^pubky:\/\//, "").split("/")[0];

  function formatDate(ts) {
    if (!ts) return "unknown";
    const d = new Date(ts > 1e15 ? Math.round(ts / 1000) : ts > 1e12 ? ts : ts * 1000);
    const p = n => String(n).padStart(2, "0");
    return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  async function nexusDetails(z32, nameEl) {
    try {
      const res = await fetch(`https://nexus.pubky.app/v0/user/${z32}/details`);
      if (res.ok) { const d = await res.json(); if (d?.name) nameEl.textContent = d.name; }
    } catch { /* ignore */ }
  }

  const parsedField = (label, content) => {
    const div = mk("div", "parsed-field");
    div.append(mk("span", "parsed-label", label), content);
    return div;
  };

  const setActive = (cls, el) => {
    document.querySelectorAll(`.${cls}.active`).forEach(e => e.classList.remove("active"));
    el.classList.add("active");
  };

  const updateMidHeader = () => {
    colMidHeaderTxt.textContent = "Checkpoint: " + (currentMidZ32 ? (checkpoints[currentMidZ32] ?? "—") : "—");
  };

  const markDirty = () => { saveBtn.disabled = false; };

  saveBtn.addEventListener("click", () => {
    const now = new Date();
    const p = n => String(n).padStart(2, "0");
    const ts = `${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
    const blob = new Blob([JSON.stringify({ version: 1, checkpoints }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `pubky-mint-checkpoints-${ts}.json`; a.click();
    URL.revokeObjectURL(url);
    saveBtn.disabled = true;
  });

  loadBtn.addEventListener("click", () => { loadInput.value = ""; loadInput.click(); });

  loadInput.addEventListener("change", () => {
    const file = loadInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); } catch { alert("Invalid JSON file."); return; }
      if (typeof parsed !== "object" || parsed === null || typeof parsed.version !== "number" || typeof parsed.checkpoints !== "object" || parsed.checkpoints === null) {
        alert("Invalid checkpoint file: missing or malformed version/checkpoints fields.");
        return;
      }
      for (const [k, v] of Object.entries(parsed.checkpoints)) {
        if (typeof k !== "string" || typeof v !== "string") {
          alert("Invalid checkpoint file: checkpoints must be string→string mappings.");
          return;
        }
      }
      Object.keys(checkpoints).forEach(k => delete checkpoints[k]);
      Object.assign(checkpoints, parsed.checkpoints);
      updateMidHeader();
      refreshUnreadMarkers();
      refreshFollowMarkers();
      saveBtn.disabled = true;
    };
    reader.readAsText(file);
  });

  function refreshFollowMarkers() {
    for (const li of followsList.querySelectorAll(".follow-item[data-pubky]")) {
      const z32 = li.dataset.pubky, lc = latestCursors[z32];
      li.classList.toggle("follow-unread", lc != null && BigInt(lc) > BigInt(checkpoints[z32] ?? 0));
    }
  }

  function refreshUnreadMarkers() {
    const cpStr = currentMidZ32 ? (checkpoints[currentMidZ32] ?? null) : null;
    const cp = BigInt(cpStr ?? 0);
    let max = 0n;
    for (const li of colMid.querySelectorAll(".event-item[data-cursor]")) {
      const cur = BigInt(li.dataset.cursor);
      li.classList.toggle("event-unread", cur > cp);
      li.classList.toggle("is-checkpoint", cpStr !== null && li.dataset.cursor === cpStr);
      if (cur > max) max = cur;
    }
    if (currentMidZ32 && max > 0n) { latestCursors[currentMidZ32] = max.toString(); refreshFollowMarkers(); }
    refreshMidLoadControls();
  }

  function hasCurrentCheckpointEventLoaded() {
    const cpStr = currentMidZ32 ? (checkpoints[currentMidZ32] ?? null) : null;
    return cpStr != null && currentLoadedCursors.has(cpStr);
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function getLoadAllButtonLabel(z32 = currentMidZ32) {
    return z32 && checkpoints[z32] != null ? "Load all until checkpoint" : "Load all events";
  }

  function refreshMidLoadControls() {
    const loadAllBtn = colMid.querySelector(".load-until-checkpoint-btn");
    if (!loadAllBtn) return;
    if (colMid.dataset.loadingAll === "true") {
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = "Loading…";
      return;
    }
    if (colMid.dataset.loadingMore === "true") {
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = getLoadAllButtonLabel();
      return;
    }
    if (!currentMidZ32) {
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = "Load all events";
      return;
    }
    const checkpointCursor = checkpoints[currentMidZ32];
    if (checkpointCursor != null && hasCurrentCheckpointEventLoaded()) {
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = "Checkpoint loaded";
      return;
    }
    if (!colMid.dataset.lastCursor) {
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = "No more events";
      return;
    }
    loadAllBtn.disabled = false;
    loadAllBtn.textContent = getLoadAllButtonLabel();
  }

  async function prefetchLatestCursor(z32) {
    try {
      const res = await fetch(`https://homeserver.pubky.app/events-stream?user=${z32}&reverse=true&limit=1`);
      if (!res.ok) return;
      const cur = parseSse(await res.text())[0]?.cursor;
      if (cur) { latestCursors[z32] = cur; refreshFollowMarkers(); }
    } catch { /* ignore */ }
  }

  function makeFollowItem(id, name = null, extraClass = "") {
    const li     = mk("li", "follow-item" + (extraClass ? " " + extraClass : ""));
    li.dataset.pubky = id;
    const nameEl = mk("div", "follow-name", name ?? "pubky" + id);
    const text   = mk("div", "follow-text");
    text.append(nameEl, mk("div", "follow-id", id));
    li.append(mkImg("follow-avatar", `https://nexus.pubky.app/static/avatar/${id}`), text);
    li.addEventListener("click", () => { setActive("follow-item", li); loadEvents(id); });
    if (name == null) nexusDetails(id, nameEl);
    return li;
  }

  function selectUser(z32) {
    let item = followsList.querySelector(`[data-pubky="${z32}"]`);
    if (!item) {
      if (!followsList.querySelector(".follows-separator")) followsList.append(mk("li", "follows-separator", "Other"));
      item = makeFollowItem(z32, null, "follow-item--guest");
      followsList.append(item);
    }
    setActive("follow-item", item);
    item.scrollIntoView({ block: "nearest" });
    loadEvents(z32);
  }

  function parseSse(text) {
    return text.split("\n\n").flatMap(block => {
      if (!block.trim()) return [];
      const ev = { type: "message", data: [], cursor: null };
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) ev.type = line.slice(6).trim();
        else if (line.startsWith("data:")) {
          const val = line.slice(5).trim();
          val.startsWith("cursor: ") ? (ev.cursor = val.slice(8)) : ev.data.push(val);
        }
      }
      return ev.data.length ? [ev] : [];
    });
  }

  function getEventKind(path) {
    if (path.includes("/posts/"))     return "post";
    if (path.includes("/tags/"))      return "tag";
    if (path.includes("/follows/"))   return "follow";
    if (path.includes("/bookmarks/")) return "bookmark";
    return "other";
  }

  function getEventIcon(path) {
    if (path.includes("/posts/"))     return svgIcon(`<path d="M2 11.5V14h2.5l7-7-2.5-2.5z"/><path d="M11.5 3.5l1 1a1 1 0 010 1.4L12 6.4 9.6 4l.5-.5a1 1 0 011.4 0z"/>`);
    if (path.includes("/bookmarks/")) return svgIcon(`<path d="M4 2h8a1 1 0 011 1v10l-5-3.2L3 13V3a1 1 0 011-1z"/>`);
    if (path.includes("/tags/"))      return svgIcon(`<path d="M2 5h7l5 3-5 3H2z"/><circle cx="4.5" cy="8" r="1"/>`);
    if (path.includes("last_read") || path.includes("last_seen")) return svgIcon(`<circle cx="8" cy="8" r="5.5"/><path d="M8 5.5V8.5l2 1.5"/>`);
    if (path.includes("settings"))    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M6.1 3.4 6.6 1.6 9.4 1.6 9.9 3.4 11.1 4.1 12.8 3.7 14.2 6 13 7.3 13 8.7 14.2 10 12.8 12.3 11.1 11.9 9.9 12.6 9.4 14.4 6.6 14.4 6.1 12.6 4.9 11.9 3.2 12.3 1.8 10 3.1 8.7 3.1 7.3 1.8 6 3.2 3.7 4.9 4.1ZM10.5 8A2.5 2.5 0 1 0 5.5 8A2.5 2.5 0 1 0 10.5 8Z"/></svg>`;
    return null;
  }

  function renderAuthorRow(container, z32, label = "Author") {
    const nameEl = mk("span", null, "pubky" + z32);
    const wrap   = mk("div", "parsed-author");
    wrap.append(mkImg("parsed-author-avatar", `https://nexus.pubky.app/static/avatar/${z32}`), nameEl);
    wrap.addEventListener("click", () => selectUser(z32));
    container.append(parsedField(label, wrap));
    nexusDetails(z32, nameEl);
  }

  async function renderQuotedPost(container, label, uri, cls = "parsed-post-quote") {
    const el = mk("div", cls, `Loading ${label}…`);
    container.append(parsedField(label, el));
    try {
      const post = await pubky.publicStorage.getJson(uri.replace(/^pubky:\/\//, "pubky"));
      el.textContent = post?.content ?? JSON.stringify(post, null, 2);
    } catch (e) {
      el.style.color = "#555";
      el.textContent = `Could not load ${label}: ${e?.message ?? e}`;
    }
  }

  async function renderBookmark(container, bm) {
    container.append(parsedField("Bookmarked", formatDate(bm.created_at)));
    if (bm.uri) {
      await renderQuotedPost(container, "Post", bm.uri, "parsed-post-content");
      renderAuthorRow(container, uriZ32(bm.uri));
    }
  }

  async function renderTag(container, tag) {
    container.append(parsedField("Tag", mk("span", "event-badge tag-badge", tag.label ?? "?")));
    const tsField = parsedField("Tagged", formatDate(tag.created_at));
    if (!tag.uri) { container.append(tsField); return; }
    if (tag.uri.includes("/pub/pubky.app/posts/")) {
      await renderQuotedPost(container, "Post", tag.uri, "parsed-post-content");
      container.append(tsField);
      renderAuthorRow(container, uriZ32(tag.uri));
    } else {
      const z32    = uriZ32(tag.uri);
      const nameEl = mk("span", null, "…");
      container.append(tsField, parsedField("User", "pubky" + z32), parsedField("Username", nameEl));
      nexusDetails(z32, nameEl);
    }
  }

  async function renderPost(container, post) {
    container.append(parsedField("Post", mk("div", "parsed-post-content", post.content ?? "")));
    if (post.parent)     { await renderQuotedPost(container, "Parent", post.parent);    renderAuthorRow(container, uriZ32(post.parent)); }
    if (post.embed?.uri) { await renderQuotedPost(container, "Embed",  post.embed.uri); renderAuthorRow(container, uriZ32(post.embed.uri)); }
  }

  function makeEventItem(ev) {
    const uri  = ev.data[0] ?? "";
    const path = uri.replace(/^pubky:\/\/[^/]+\//, "");
    const li   = mk("li", "event-item");
    li.dataset.kind = getEventKind(path);
    if (ev.cursor != null) li.dataset.cursor = ev.cursor;
    const iconEl = mk("span", "event-icon");
    const iconSvg = getEventIcon(path);
    if (iconSvg) iconEl.innerHTML = iconSvg;
    li.append(iconEl, mk("span", `event-badge event-${ev.type.toLowerCase()}`, ev.type), mk("span", "event-path", path));
    if (ev.cursor != null) {
      const btn = mk("button", "checkpoint-btn", "Set checkpoint");
      btn.title = "Setting an event as checkpoint marks all of this user's events up to here as read, all newer events as unread.";
      btn.addEventListener("click", e => {
        e.stopPropagation();
        checkpoints[currentMidZ32] = ev.cursor;
        updateMidHeader();
        refreshUnreadMarkers();
        markDirty();
      });
      li.append(mk("span", "event-cursor", ev.cursor), btn);
    }
    li.addEventListener("click", () => { setActive("event-item", li); loadContent(uri, path); });
    return li;
  }

  function appendEvents(ul, evs) {
    let last = null;
    for (const ev of evs) {
      ul.append(makeEventItem(ev));
      if (ev.cursor) {
        currentLoadedCursors.add(ev.cursor);
        last = ev.cursor;
      }
    }
    return last;
  }

  function applyFilter() {
    const val = document.querySelector('input[name="event-filter"]:checked')?.value ?? "all";
    for (const li of colMid.querySelectorAll(".event-item[data-kind]")) {
      li.style.display = (val === "all" || li.dataset.kind === val) ? "" : "none";
    }
  }

  document.getElementById("col-mid-filter").addEventListener("change", applyFilter);

  async function fetchEvents(userParam) {
    const res = await fetch(`https://homeserver.pubky.app/events-stream?user=${userParam}&reverse=true&limit=1000`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return parseSse(await res.text());
  }

  async function loadEvents(id) {
    const z32 = id.startsWith("pubky") ? id.slice(5) : id;
    currentMidZ32 = z32;
    colMid.dataset.lastCursor = "";
    updateMidHeader();
    document.querySelector('input[name="event-filter"][value="post"]').checked = true;
    midMsg("Loading…");
    colRight.innerHTML = "";
    let events;
    try { events = await fetchEvents(z32); }
    catch { midMsg("Failed to load events."); return; }
    if (!events.length) { midMsg("No recent events."); return; }

    colMid.innerHTML = "";
    currentLoadedCursors = new Set();
    const ul = mk("ul", "events-list");
    let lastCursor = null;
    const setLastCursor = cursor => {
      lastCursor = cursor ?? null;
      colMid.dataset.lastCursor = lastCursor ?? "";
    };
    setLastCursor(appendEvents(ul, events));
    colMid.append(ul);
    refreshUnreadMarkers();
    applyFilter();

    const rangeEl = mk("p", "events-range");
    const updateRange = () => { rangeEl.textContent = `Browsing most recent ${ul.querySelectorAll(".event-item").length} events`; };
    updateRange();

    const loadNextPage = async () => {
      if (!lastCursor) return [];
      const more = await fetchEvents(`${z32}:${lastCursor}`);
      if (!more.length) { setLastCursor(null); return []; }
      setLastCursor(appendEvents(ul, more));
      refreshUnreadMarkers();
      applyFilter();
      updateRange();
      return more;
    };

    const btn = mk("button", "load-more-btn", "Load more events");
    const loadAllBtn = mk("button", "load-more-btn load-until-checkpoint-btn", getLoadAllButtonLabel(z32));
    btn.addEventListener("click", async () => {
      if (!lastCursor) return;
      colMid.dataset.loadingMore = "true";
      btn.disabled = true;
      loadAllBtn.disabled = true;
      btn.textContent = "Loading…";
      try {
        const more = await loadNextPage();
        if (!more.length) { btn.textContent = "No more events"; return; }
        btn.disabled = false;
        btn.textContent = "Load more events";
      } catch {
        btn.textContent = "Failed to load";
        btn.disabled = false;
      } finally {
        delete colMid.dataset.loadingMore;
        refreshMidLoadControls();
      }
    });
    loadAllBtn.addEventListener("click", async () => {
      const checkpointCursor = checkpoints[z32];
      if (!lastCursor || (checkpointCursor != null && currentLoadedCursors.has(checkpointCursor))) return;
      colMid.dataset.loadingAll = "true";
      btn.disabled = true;
      loadAllBtn.disabled = true;
      loadAllBtn.textContent = "Loading…";
      let failed = false;
      try {
        while (lastCursor && (checkpointCursor == null || !currentLoadedCursors.has(checkpointCursor))) {
          const more = await loadNextPage();
          if (!more.length) break;
          await wait(1000);
        }
      } catch {
        failed = true;
        loadAllBtn.textContent = "Failed to load";
        loadAllBtn.disabled = false;
      } finally {
        delete colMid.dataset.loadingAll;
        if (btn.textContent !== "No more events") btn.disabled = false;
        if (!failed) refreshMidLoadControls();
      }
    });
    const wrap = mk("div", "load-more-wrap");
    const actions = mk("div", "load-more-actions");
    actions.append(btn, loadAllBtn);
    wrap.append(rangeEl, actions);
    colMid.append(wrap);
    refreshMidLoadControls();
  }

  async function loadContent(uri, path) {
    if (path.startsWith("pub/pubky.app/blobs/")) { colRight.innerHTML = ""; return; }
    const sub0 = path.slice("pub/pubky.app/".length);
    const postLink = sub0.startsWith("posts/")
      ? ` <a href="https://pubky.app/post/${uriZ32(uri)}/${sub0.slice("posts/".length)}" target="_blank" rel="noopener noreferrer" id="open-in-pubky">Open in Pubky.app</a>`
      : "";
    colRight.innerHTML =
      `<div id="content-path">${path}${postLink}</div>` +
      `<div id="parsed-section"></div>` +
      `<div id="raw-section"><div class="raw-label">Raw</div><div id="content-body">Loading…</div></div>`;
    const ps     = document.getElementById("parsed-section");
    const bodyEl = document.getElementById("content-body");
    let data = null;
    try {
      data = await pubky.publicStorage.getJson(uri);
      bodyEl.textContent = JSON.stringify(data, null, 2);
    } catch {
      try { bodyEl.textContent = await pubky.publicStorage.getText(uri); }
      catch (e) { bodyEl.style.color = "#555"; bodyEl.textContent = `Could not load content:\n${e?.message ?? e}`; }
    }
    const sub = path.slice("pub/pubky.app/".length);
    if (sub.startsWith("follows/")) {
      renderAuthorRow(ps, path.split("/").pop(), "Followed");
      if (data) ps.append(parsedField("Followed at", formatDate(data.created_at)));
    } else if (data) {
      if      (sub.startsWith("bookmarks/")) await renderBookmark(ps, data);
      else if (sub.startsWith("tags/"))      await renderTag(ps, data);
      else if (sub.startsWith("posts/"))     await renderPost(ps, data);
      else if (sub.startsWith("last_read"))  ps.append(parsedField("Last read", formatDate(data.created_at ?? data.timestamp ?? data.read_at ?? Object.values(data)[0])));
      else if (sub.startsWith("settings"))   ps.append(parsedField("Updated at", formatDate(data.updatedAt)));
    }
  }

  // Boot
  await init();
  const pubky = new Pubky();
  let session = null;

  const saved = localStorage.getItem("pubky-session");
  if (saved) {
    try { session = await pubky.restoreSession(saved); }
    catch { localStorage.removeItem("pubky-session"); }
  }

  if (!session) {
    const flow = pubky.startAuthFlow("/pub/pubky.app/:r", AuthFlowKind.signin());
    await QRCode.toCanvas(document.getElementById("qr-canvas"), flow.authorizationUrl,
      { width: 280, margin: 1, color: { dark: "#000", light: "#fff" } });
    authStatus.textContent = "Waiting for approval…";
    session = await flow.awaitApproval();
    localStorage.setItem("pubky-session", session.export());
  }

  authScreen.style.display = "none";
  appEl.style.display = "flex";

  const userId  = session.info.publicKey.toString();
  const userZ32 = session.info.publicKey.z32();

  const headerAvatar = document.getElementById("header-avatar");
  headerAvatar.src = `https://nexus.pubky.app/static/avatar/${userZ32}`;
  headerAvatar.onerror = () => { headerAvatar.onerror = null; headerAvatar.src = `https://nexus.pubky.app/static/avatar/${userId}`; };
  nexusDetails(userZ32, document.getElementById("header-name"));
  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("pubky-session");
    location.reload();
  });

  let followIds = [], users = [];
  try {
    const r1 = await fetch(`https://nexus.pubky.app/v0/user/${userZ32}/following`);
    if (r1.ok) {
      followIds = await r1.json();
      if (followIds.length) {
        const r2 = await fetch("https://nexus.pubky.app/v0/stream/users/by_ids", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_ids: followIds, viewer_id: userZ32 }),
        });
        if (r2.ok) users = await r2.json();
      }
    }
  } catch (e) { console.error(e); }

  const userMap = Object.fromEntries(users.map(u => [u.details.id, u]));
  const follows = followIds.map(id => userMap[id]?.details ?? { id, name: id });

  followsList.innerHTML = "";
  if (!follows.length) {
    followsList.innerHTML = '<li class="list-msg">Not following anyone yet.</li>';
  } else {
    // Render items immediately, then prefetch cursors one at a time to stay
    // under the homeserver rate limit (sequential avoids the 429 / CORS burst).
    follows.forEach(({ name, id }) => {
      followsList.append(makeFollowItem(id, name));
    });
    (async () => {
      for (const { id } of follows) {
        try { await prefetchLatestCursor(id); } catch { /* keep queue running */ }
        await new Promise(r => setTimeout(r, 1000));
      }
    })();
  }
</script>

</body>
</html>
