name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_LIB_REF: v0.6.0   # <-- pin to a commit SHA or tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Cache WASM pkg/ output
        id: cache-pkg
        uses: actions/cache@v4
        with:
          path: pkg
          key: wasm-pkg-${{ env.WASM_LIB_REF }}

      - name: Install Rust toolchain
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Checkout Pubky SDK repo at pinned commit
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: pubky/pubky-core
          ref: ${{ env.WASM_LIB_REF }}
          path: _wasm_lib

      - name: Cache Rust build artifacts
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "_wasm_lib -> _wasm_lib/target"

      - name: Build pkg/ from GitHub source
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        run: |
          cd _wasm_lib
          cd pubky-sdk/bindings/js
          rm -rf pkg
          wasm-pack build --target web
          cd ../../../../
          mv _wasm_lib/pubky-sdk/bindings/js/pkg .

      - name: Stage deployment directory
        run: |
          mkdir _site
          cp index.html _site/
          cp -r pkg _site/
          cp LICENSE _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
